<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>海鸥云盘</title>
<link rel="manifest" href="static/manifest.webmanifest">
<meta name="theme-color" content="#0e1014">
<link rel="stylesheet" href="static/style.css?v=9">
</head>
<body>
<div id="app">
  <!-- login -->
  <section id="view-login" class="center-view hidden">
    <div class="card auth-card">
      <div class="logo">☁️</div>
      <h1>海鸥云盘</h1>
      <p class="muted">Telegram 频道当硬盘，自己部署自己用</p>
      <form id="login-form">
        <input type="password" id="login-password" placeholder="管理密码" autocomplete="current-password" required>
        <button class="primary" type="submit">进入</button>
      </form>
      <p class="err" id="login-err"></p>
    </div>
  </section>

  <!-- telegram setup -->
  <section id="view-setup" class="center-view hidden">
    <div class="card auth-card wide">
      <h1>连接 Telegram</h1>
      <p class="muted">到 <a href="https://my.telegram.org" target="_blank" rel="noopener">my.telegram.org</a> →
        API development tools 建一个应用，拿 api_id / api_hash。手机号要带国家码，比如 +8613800000000。</p>
      <div id="setup-step-1">
        <label>api_id <input id="api-id" inputmode="numeric" placeholder="12345678"></label>
        <label>api_hash <input id="api-hash" placeholder="0123456789abcdef0123456789abcdef"></label>
        <label>手机号 <input id="api-phone" placeholder="+8613800000000"></label>
        <button class="primary" id="btn-send-code">发送验证码</button>
      </div>
      <div id="setup-step-2" class="hidden">
        <label>验证码 <input id="login-code" inputmode="numeric" autocomplete="one-time-code" placeholder="12345"></label>
        <button class="primary" id="btn-submit-code">提交</button>
      </div>
      <div id="setup-step-3" class="hidden">
        <label>两步验证密码 <input id="login-2fa" type="password" placeholder="Two-step password"></label>
        <button class="primary" id="btn-submit-2fa">提交</button>
      </div>
      <p class="err" id="setup-err"></p>
      <p class="muted small" id="setup-note"></p>
    </div>
  </section>

  <!-- main -->
  <section id="view-main" class="hidden">
    <aside id="sidebar">
      <div class="brand"><span class="logo-sm">☁️</span> 海鸥云盘</div>
      <button class="ghost full" id="btn-new-folder">＋ 新建文件夹</button>
      <nav id="folder-list"></nav>
      <div class="sidebar-foot">
        <div id="account-line" class="muted small"></div>
        <button class="ghost full" id="btn-shares">我的分享</button>
        <button class="ghost full" id="btn-settings">WebDAV 挂载</button>
        <button class="ghost full" id="btn-tg-logout">断开 Telegram</button>
        <button class="ghost full" id="btn-logout">退出登录</button>
      </div>
    </aside>

    <main id="content">
      <header id="topbar">
        <button class="ghost icon" id="btn-menu" aria-label="菜单">☰</button>
        <h2 id="folder-title">文件</h2>
        <div class="spacer"></div>
        <button class="ghost icon" id="btn-share-folder" title="分享文件夹">📤</button>
        <button class="ghost icon" id="btn-select" title="多选">☑</button>
        <input id="search" type="search" placeholder="搜索文件名">
        <label class="btn primary" id="btn-upload-label">
          上传 <input id="file-input" type="file" multiple>
        </label>
      </header>

      <div id="batch-bar" class="hidden">
        <span id="batch-count">已选 0 项</span>
        <button class="ghost" id="batch-download">下载</button>
        <button class="ghost" id="batch-move">移动</button>
        <button class="ghost danger" id="batch-delete">删除</button>
        <button class="ghost" id="batch-cancel">取消</button>
      </div>

      <div id="drop-hint" class="hidden">松开上传到当前文件夹</div>
      <div id="file-grid"></div>
      <div id="empty" class="hidden">
        <p>这里还是空的。</p>
        <p class="muted">把文件拖进来，或者点右上角「上传」。</p>
      </div>
      <div id="load-more" class="hidden"><button class="ghost" id="btn-load-more">加载更多</button></div>
    </main>
  </section>

  <!-- upload panel -->
  <div id="upload-panel" class="hidden">
    <div class="panel-head"><span>上传队列</span><button class="ghost icon" id="btn-close-uploads">×</button></div>
    <div id="upload-list"></div>
  </div>

  <!-- preview -->
  <div id="preview" class="hidden">
    <div class="preview-body" id="preview-body"></div>
    <div class="preview-bar">
      <span id="preview-name"></span>
      <a class="btn ghost" id="preview-download" href="#" download>下载</a>
      <button class="btn ghost" id="preview-close">关闭</button>
    </div>
  </div>

  <!-- dialog -->
  <div id="dialog-backdrop" class="hidden">
    <div class="card dialog" id="dialog" role="dialog" aria-modal="true"></div>
  </div>

  <div id="sidebar-backdrop" class="hidden"></div>
  <div id="toasts"></div>
</div>
<script src="static/app.js?v=9"></script>
</body>
</html>
