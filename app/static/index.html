<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HaoDrive</title>
<link rel="manifest" href="static/manifest.webmanifest">
<meta name="theme-color" content="#0b0d12">
<link rel="stylesheet" href="static/style.css?v=15">
</head>
<body>
<!-- icon sprite: stroke icons, drawn once and reused with <use> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19a4.5 4.5 0 0 0 .4-8.98A6 6 0 0 0 6.3 9.5 4 4 0 0 0 6 17.5"/><path d="M12 12v6"/><path d="m9.5 14.5 2.5-2.5 2.5 2.5"/></symbol>

    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5.5" width="13" height="13" rx="2.5"/><path d="m16 10.5 4-2.2a.6.6 0 0 1 .9.5v6.4a.6.6 0 0 1-.9.5l-4-2.2z"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V6.5l9-2v11"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="15.5" cy="15.5" r="2.5"/></symbol>
    <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 16.5v-4h1.4a1.3 1.3 0 0 1 0 2.6H8.5"/><path d="M13.6 12.5h1.7a2 2 0 0 1 0 4h-1.7z"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 12.5h7M8.5 15.5h7M8.5 18h4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4.5"/><path d="m7.5 9 4.5-4.5L16.5 9"/><path d="M4.5 15.5v2A2.5 2.5 0 0 0 7 20h10a2.5 2.5 0 0 0 2.5-2.5v-2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4.5V16"/><path d="m7.5 11.5 4.5 4.5 4.5-4.5"/><path d="M4.5 15.5v2A2.5 2.5 0 0 0 7 20h10a2.5 2.5 0 0 0 2.5-2.5v-2"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="17.5" cy="6" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="18" r="2.5"/><path d="m8.7 10.8 6.6-3.5M8.7 13.2l6.6 3.5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4"/><path d="M4 20h16"/><rect x="7.5" y="12" width="3.2" height="5" rx="1"/><rect x="13" y="8" width="3.2" height="9" rx="1"/><rect x="18.5" y="10" width="3.2" height="7" rx="1"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M9.5 14.5 14.5 9.5"/><path d="M11 6.5 12.8 4.7a3.6 3.6 0 0 1 5.1 0l1.4 1.4a3.6 3.6 0 0 1 0 5.1L17.5 13"/><path d="M13 17.5 11.2 19.3a3.6 3.6 0 0 1-5.1 0l-1.4-1.4a3.6 3.6 0 0 1 0-5.1L6.5 11"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-2"/><path d="M10 12h10"/><path d="m17 9 3 3-3 3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15"/><path d="M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7"/><path d="M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4L17.5 7"/><path d="M10 11v5.5M14 11v5.5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="m13.5 7 3 3"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="m8.5 6.5 3.5-3.5 3.5 3.5M8.5 17.5 12 21l3.5-3.5M6.5 8.5 3 12l3.5 3.5M17.5 8.5 21 12l-3.5 3.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5V9H15"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.2"/><path d="M7.5 10.5V7.8a4.5 4.5 0 0 1 9 0v2.7"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="6.5" rx="2"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="2"/><path d="M7 7.2h.01M7 16.8h.01"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.2 8.2 0 1 1 9.8 4a6.6 6.6 0 0 0 10.2 10.2z"/></symbol>
    <symbol id="i-desktop" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.4 2.4 3.6 5.3 3.6 8.5s-1.2 6.1-3.6 8.5c-2.4-2.4-3.6-5.3-3.6-8.5S9.6 5.9 12 3.5z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 6.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h.5"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 20h18.4z"/><path d="M12 10v4.2M12 17.2h.01"/></symbol>
  </defs>
</svg>

<div id="app">
  <!-- login -->
  <section id="view-login" class="center-view hidden">
    <div class="card auth-card">
      <button class="ghost icon lang-toggle" data-i18n-title="语言" aria-label="Language">EN</button>
      <div class="logo"><svg class="ic ic-lg"><use href="#i-cloud"/></svg></div>
      <h1 id="login-title">HaoDrive</h1>
      <p class="muted" data-i18n="Telegram 频道当硬盘，自己部署自己用">Telegram 频道当硬盘，自己部署自己用</p>
      <form id="login-form">
        <input type="password" id="login-password" data-i18n-placeholder="管理密码" placeholder="管理密码" autocomplete="current-password" required>
        <button class="primary full" type="submit" data-i18n="进入">进入</button>
      </form>
      <p class="err" id="login-err"></p>
    </div>
  </section>

  <!-- telegram setup -->
  <section id="view-setup" class="center-view hidden">
    <div class="card auth-card wide">
      <button class="ghost icon lang-toggle" data-i18n-title="语言" aria-label="Language">EN</button>
      <h1 data-i18n="连接 Telegram">连接 Telegram</h1>
      <p class="muted" data-i18n-html="到 my.telegram.org → API development tools 建一个应用，拿 api_id / api_hash。手机号要带国家码，比如 +8613800000000。">到 <a href="https://my.telegram.org" target="_blank" rel="noopener">my.telegram.org</a> →
        API development tools 建一个应用，拿 api_id / api_hash。手机号要带国家码，比如 +8613800000000。</p>
      <div id="setup-step-1">
        <label>api_id <input id="api-id" inputmode="numeric" placeholder="12345678"></label>
        <label>api_hash <input id="api-hash" placeholder="0123456789abcdef0123456789abcdef"></label>
        <label><span data-i18n="手机号">手机号</span> <input id="api-phone" placeholder="+8613800000000"></label>
        <button class="primary full" id="btn-send-code" data-i18n="发送验证码">发送验证码</button>
      </div>
      <div id="setup-step-2" class="hidden">
        <label><span data-i18n="验证码">验证码</span> <input id="login-code" inputmode="numeric" autocomplete="one-time-code" placeholder="12345"></label>
        <button class="primary full" id="btn-submit-code" data-i18n="提交">提交</button>
      </div>
      <div id="setup-step-3" class="hidden">
        <label><span data-i18n="两步验证密码">两步验证密码</span> <input id="login-2fa" type="password" data-i18n-placeholder="两步验证密码" placeholder="Two-step password"></label>
        <button class="primary full" id="btn-submit-2fa" data-i18n="提交">提交</button>
      </div>
      <p class="err" id="setup-err"></p>
      <p class="muted small" id="setup-note"></p>
    </div>
  </section>

  <!-- main -->
  <section id="view-main" class="hidden">
    <aside id="sidebar">
      <div class="brand">
        <span class="logo-sm"><svg class="ic"><use href="#i-cloud"/></svg></span>
        <span id="brand-name">HaoDrive</span>
      </div>
      <button class="btn-new-folder" id="btn-new-folder">
        <svg class="ic"><use href="#i-plus"/></svg><span data-i18n="新建文件夹">新建文件夹</span>
      </button>
      <div class="sidebar-label" data-i18n="文件夹">文件夹</div>
      <nav id="folder-list"></nav>
      <div class="sidebar-foot">
        <div class="account-chip">
          <span class="avatar" id="account-avatar">H</span>
          <span id="account-line" class="muted small"></span>
        </div>
        <button class="ghost full" id="btn-tg-logout"><svg class="ic"><use href="#i-x"/></svg><span data-i18n="断开 Telegram">断开 Telegram</span></button>
        <button class="ghost full" id="btn-logout"><svg class="ic"><use href="#i-logout"/></svg><span data-i18n="退出登录">退出登录</span></button>
        <div class="foot-row">
          <button class="ghost icon lang-toggle" data-i18n-title="语言" aria-label="Language">EN</button>
          <button class="ghost icon theme-toggle" data-i18n-title="主题" aria-label="Theme"><svg class="ic"><use href="#i-moon"/></svg></button>
        </div>
      </div>
    </aside>

    <main id="content">
      <header id="topbar">
        <button class="ghost icon" id="btn-menu" data-i18n-aria="菜单" aria-label="菜单"><svg class="ic"><use href="#i-menu"/></svg></button>
        <h2 id="folder-title" data-i18n="文件">文件</h2>
        <div class="spacer"></div>
        <div id="topbar-files">
          <button class="ghost icon" id="btn-share-folder" data-i18n-title="分享文件夹" title="分享文件夹"><svg class="ic"><use href="#i-share"/></svg></button>
          <button class="ghost icon" id="btn-select" data-i18n-title="多选" title="多选"><svg class="ic"><use href="#i-check"/></svg></button>
          <div class="search-box">
            <svg class="ic"><use href="#i-search"/></svg>
            <input id="search" type="search" data-i18n-placeholder="搜索文件名" placeholder="搜索文件名">
          </div>
          <label class="btn primary" id="btn-upload-label">
            <svg class="ic"><use href="#i-upload"/></svg>
            <span data-i18n="上传">上传</span>
            <input id="file-input" type="file" multiple>
          </label>
        </div>
      </header>

      <div id="batch-bar" class="hidden">
        <span id="batch-count">已选 0 项</span>
        <button class="ghost" id="batch-download" data-i18n="下载">下载</button>
        <button class="ghost" id="batch-move" data-i18n="移动">移动</button>
        <button class="ghost" id="batch-delete" data-i18n="删除">删除</button>
        <button class="ghost" id="batch-cancel" data-i18n="取消">取消</button>
      </div>

      <div id="drop-hint" class="hidden" data-i18n="松开上传到当前文件夹">松开上传到当前文件夹</div>

      <div id="files-page">
        <div id="file-grid"></div>
        <div id="empty" class="hidden">
          <p data-i18n="这里还是空的。">这里还是空的。</p>
          <p class="muted" data-i18n="把文件拖进来，或者点右上角「上传」。">把文件拖进来，或者点右上角「上传」。</p>
        </div>
        <div id="load-more" class="hidden"><button class="ghost" id="btn-load-more" data-i18n="加载更多">加载更多</button></div>
      </div>

      <section id="stats-page" class="hidden">
        <div class="stat-grid">
          <article class="stat-tile">
            <span class="stat-label" data-i18n="已用空间">已用空间</span>
            <strong id="stat-used">—</strong>
            <div class="meter" aria-hidden="true"><span id="stat-meter"></span></div>
            <span class="small muted" id="stat-quota"></span>
          </article>
          <article class="stat-tile">
            <span class="stat-label" data-i18n="累计上传">累计上传</span>
            <strong id="stat-up">—</strong>
            <span class="small muted" id="stat-up-files"></span>
          </article>
          <article class="stat-tile">
            <span class="stat-label" data-i18n="累计下载">累计下载</span>
            <strong id="stat-down">—</strong>
            <span class="small muted" id="stat-down-files"></span>
          </article>
          <article class="stat-tile">
            <span class="stat-label" data-i18n="服务器磁盘">服务器磁盘</span>
            <strong id="stat-disk">—</strong>
            <span class="small muted" id="stat-disk-free"></span>
          </article>
        </div>

        <article class="card chart-card">
          <div class="chart-head">
            <div>
              <h3 data-i18n="上传/下载流量">上传/下载流量</h3>
              <p class="small muted" id="stats-today"></p>
            </div>
            <div class="chart-controls">
              <select id="stats-days">
                <option value="7" data-i18n="近 7 天">近 7 天</option>
                <option value="30" selected data-i18n="近 30 天">近 30 天</option>
                <option value="90" data-i18n="近 90 天">近 90 天</option>
              </select>
              <button class="ghost icon" id="stats-refresh" data-i18n-title="刷新" title="刷新"><svg class="ic"><use href="#i-refresh"/></svg></button>
            </div>
          </div>
          <div class="legend" id="traffic-legend">
            <span><i class="swatch up"></i><span data-i18n="上传">上传</span></span>
            <span><i class="swatch down"></i><span data-i18n="下载">下载</span></span>
          </div>
          <div id="traffic-chart" class="chart"></div>
          <details class="chart-table"><summary data-i18n="数据表">数据表</summary><div id="traffic-table"></div></details>
        </article>

        <article class="card">
          <div class="chart-head">
            <h3 data-i18n="文件夹占用">文件夹占用</h3>
            <span class="small muted" id="stats-updated"></span>
          </div>
          <div id="folder-bars" class="folder-bars"></div>
        </article>
      </section>

      <section id="settings-page" class="hidden">
        <div id="settings-body"></div>
      </section>
    </main>

    <nav id="bottom-nav" aria-label="主导航">
      <button class="nav-box active" id="btn-nav-files" data-nav="files">
        <svg class="ic"><use href="#i-folder"/></svg>
        <span class="nav-label" data-i18n="文件">文件</span>
      </button>
      <button class="nav-box" id="btn-stats" data-nav="stats">
        <svg class="ic"><use href="#i-chart"/></svg>
        <span class="nav-label" data-i18n="概览">概览</span>
      </button>
      <button class="nav-box" id="btn-shares" data-nav="shares">
        <svg class="ic"><use href="#i-link"/></svg>
        <span class="nav-label" data-i18n="我的分享">我的分享</span>
      </button>
      <button class="nav-box" id="btn-settings" data-nav="settings">
        <svg class="ic"><use href="#i-settings"/></svg>
        <span class="nav-label" data-i18n="设置">设置</span>
      </button>
    </nav>
  </section>

  <!-- transfers -->
  <div id="upload-panel" class="hidden">
    <div class="panel-head"><span data-i18n="传输队列">传输队列</span><button class="ghost icon" id="btn-close-uploads"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div id="upload-list"></div>
  </div>

  <!-- preview -->
  <div id="preview" class="hidden">
    <div class="preview-body" id="preview-body"></div>
    <div class="preview-bar">
      <span id="preview-name"></span>
      <a class="btn ghost" id="preview-download" href="#" download data-i18n="下载">下载</a>
      <button class="btn ghost" id="preview-close" data-i18n="关闭">关闭</button>
    </div>
  </div>

  <!-- dialog -->
  <div id="dialog-backdrop" class="hidden">
    <div class="card dialog" id="dialog" role="dialog" aria-modal="true"></div>
  </div>

  <div id="sidebar-backdrop" class="hidden"></div>
  <div id="toasts"></div>
</div>
<script src="static/i18n.js?v=15"></script>
<script src="static/app.js?v=15"></script>
</body>
</html>
