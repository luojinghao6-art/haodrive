# HaoDrive 反向代理示例（nginx ≥ 1.20）
#
# 用法：
#   1. 把 <DOMAIN> 换成你的域名，<SECRET_PATH> 换成 .env 里的 SECRET_PATH
#   2. 证书路径按自己的来（下面示例用 certbot 的默认位置）
#   3. 放进 /etc/nginx/conf.d/haodrive.conf，然后 nginx -t && systemctl reload nginx
#
# 三个不能省的设置：
#   proxy_request_buffering off   流式上传必须直通，否则 nginx 会先把整个
#                                 请求体收完再转发，v11.1 的边收边发就废了
#   proxy_buffering off           下载/播放不攒缓冲，拖动进度条才跟手
#   proxy_read_timeout 3600s      大文件传一小时也不会被掐

server {
    listen 80;
    server_name <DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                     # nginx < 1.25.1 请改成 listen 443 ssl http2;
    server_name <DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 单文件上限交给应用自己判断（分片可以很大）
    client_max_body_size 0;
    client_body_timeout  3600s;

    # 分享链接：路径本身就是随机 token
    location /s/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_send_timeout      3600s;
        proxy_read_timeout      3600s;
    }

    # 主体：只在随机密钥路径下响应，等同于 Caddy 的 strip_prefix
    location /<SECRET_PATH>/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /<SECRET_PATH>;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_send_timeout      3600s;
        proxy_read_timeout      3600s;
    }

    # 少写一个斜杠别 404，补上
    location = /<SECRET_PATH> {
        return 308 /<SECRET_PATH>/;
    }

    location / {
        return 404;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "no-referrer" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
}
